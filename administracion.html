<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas - Boutique Yesica</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B; --secondary: #D9C3B0; --bg-color: #FDFBF7; --card-bg: #FFFFFF;
      --border: #E5E5E5; --text-dark: #2B2B2B; --text-muted: #737373; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; padding-bottom: 60px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    .section-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; margin-bottom: 24px; }
    /* Reutiliza tu CSS minimalista aquí */
  </style>
</head>
<body>
  <header>
    <div><a href="admin.html" style="color:var(--text-dark); text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Volver</a></div>
    <div style="font-weight:800;">Panel Financiero</div>
    <button id="btnLogoutAdmin" style="background:none; border:none; cursor:pointer;"><i class="fa-solid fa-power-off"></i></button>
  </header>
  <main class="main-wrapper">
    <div id="contentWrapper">
      <!-- Los contenedores IDs permanecen intactos -->
      <div class="section-card">
        <h3><i class="fa-solid fa-sack-dollar"></i> Registrar Gasto</h3>
        <form id="gastoForm">
          <input type="text" id="gastoConcepto" placeholder="Concepto" required>
          <input type="number" step="0.01" id="gastoMonto" placeholder="Monto" required>
          <select id="gastoCategoria"><option value="operativo">Operativo</option></select>
          <button type="submit">Agregar Gasto</button>
        </form>
      </div>
      <div class="section-card">
        <table style="width:100%; text-align:left;">
          <thead><tr><th>Concepto</th><th>Monto</th></tr></thead>
          <tbody id="gastosBody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script>
    // IMPORTANTE: Como tu código original se cortó en el mensaje,
    // por favor PEGA AQUÍ todo el script original intacto de administracion.html
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    document.getElementById('btnLogoutAdmin').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'admin.html';
    });
    // ...resto de tu script...
  </script>
</body>
</html>
