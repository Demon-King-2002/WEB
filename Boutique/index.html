<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Boutique - Catálogo Exclusivo</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    /* Forzar la eliminación del botón flotante de Netlify */
    div[class*="netlify"], #netlify-badge, [id*="netlify"], [class*="netlify-badge"], iframe[src*="netlify"] { 
      display: none !important; 
      pointer-events: none !important; 
      visibility: hidden !important; 
      opacity: 0 !important;
      width: 0 !important;
      height: 0 !important;
    }

    :root {
      --primary: #FF1493;       /* Magenta Vibrante */
      --primary-hover: #E0007A;
      --secondary: #7B2CBF;     /* Violeta Eléctrico */
      --accent: #FF5E7E;        /* Coral Vivo */
      --gold: #FFD700;          /* Dorado Elegante */
      --bg-gradient: linear-gradient(135deg, #FFF0F6 0%, #F3E8FF 50%, #FFE5EC 100%);
      --card-bg: rgba(255, 255, 255, 0.85);
      --glass-border: rgba(255, 255, 255, 0.6);
      --text-dark: #2A082C;
      --text-muted: #6C5268;
      --shadow-vivid: 0 12px 35px -8px rgba(255, 20, 147, 0.22);
      --shadow-hover: 0 20px 40px -10px rgba(123, 44, 191, 0.35);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      min-height: 100vh;
      padding-bottom: 50px;
      overflow-x: hidden;
    }

    /* Esferas de brillo decorativas */
    .glow-sphere-1 {
      position: fixed;
      top: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(255,20,147,0.3) 0%, rgba(255,255,255,0) 70%);
      z-index: -1;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .glow-sphere-2 {
      position: fixed;
      bottom: -150px;
      left: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(123,44,191,0.25) 0%, rgba(255,255,255,0) 70%);
      z-index: -1;
      animation: floatGlow 10s ease-in-out infinite alternate-reverse;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, 40px) scale(1.1); }
    }

    /* Encabezado */
    header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--glass-border);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 25px rgba(0,0,0,0.05);
    }

    .nav-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      box-shadow: 0 6px 18px rgba(255, 20, 147, 0.4);
      animation: pulseLogo 3s infinite alternate;
    }

    @keyframes pulseLogo {
      0% { transform: scale(1); }
      100% { transform: scale(1.06); }
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .logo-text span {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .user-avatar {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #FF758C, #FF7EB3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 14px;
    }

    .user-info p {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .user-info span {
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
    }

    .user-actions {
      display: flex;
      gap: 6px;
    }

    .btn-user-action {
      background: #F4E8F4;
      border: none;
      color: var(--text-dark);
      cursor: pointer;
      font-size: 13px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-user-action:hover {
      background: var(--primary);
      color: white;
    }

    /* Botón de acceso exclusivo con solo ícono */
    .btn-login-icon {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: var(--shadow-vivid);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .btn-login-icon:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: var(--shadow-hover);
    }

    /* Main Container */
    .main-wrapper {
      max-width: 1300px;
      margin: 30px auto;
      padding: 0 24px;
    }

    /* Hero Banner más llamativo */
    .hero-banner {
      background: linear-gradient(135deg, rgba(255,20,147,0.85), rgba(123,44,191,0.9)), url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=1200&q=80');
      background-blend-mode: overlay;
      background-size: cover;
      background-position: center;
      border-radius: var(--radius);
      padding: 40px 45px;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-vivid);
      margin-bottom: 30px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .hero-content h2 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.2);
      letter-spacing: -0.5px;
    }

    .hero-content p {
      font-size: 16px;
      opacity: 0.95;
      max-width: 600px;
      font-weight: 500;
      line-height: 1.5;
    }

    .btn-add-product {
      background: #FFFFFF;
      color: var(--primary);
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .btn-add-product:hover {
      transform: scale(1.05) translateY(-2px);
      background: #FFF0F6;
      color: var(--primary-hover);
    }

    /* Filtros */
    .filters-section {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.03);
    }

    .category-tabs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 16px;
      scrollbar-width: thin;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.8);
      border: 1.5px solid #EAE0EA;
      color: var(--text-dark);
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tab-btn i {
      color: var(--primary);
    }

    .tab-btn:hover {
      border-color: var(--primary);
      background: #FFF0F6;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border-color: transparent;
      box-shadow: 0 6px 18px rgba(255, 20, 147, 0.35);
    }

    .tab-btn.active i {
      color: white;
    }

    .subfilters-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid #F0E6F0;
    }

    .gender-toggle {
      display: flex;
      background: #F4E8F4;
      padding: 4px;
      border-radius: 30px;
      gap: 4px;
    }

    .gender-btn {
      border: none;
      background: transparent;
      padding: 8px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .gender-btn.active {
      background: white;
      color: var(--primary);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .search-box {
      position: relative;
      flex-grow: 1;
      max-width: 380px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 42px;
      border-radius: 30px;
      border: 1.5px solid #EAE0EA;
      outline: none;
      font-size: 13px;
      transition: all 0.3s ease;
      background: white;
    }

    .search-box input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 20, 147, 0.12);
    }

    .search-box i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Cards de Productos */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.04);
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(255, 20, 147, 0.3);
    }

    .card-img-wrapper {
      width: 100%;
      height: 240px;
      position: relative;
      overflow: hidden;
      background: #F9EFF9;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .product-card:hover .card-img-wrapper img {
      transform: scale(1.08);
    }

    .badge-gender {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .badge-dama { background: rgba(255, 20, 147, 0.85); color: white; }
    .badge-caballero { background: rgba(123, 44, 191, 0.85); color: white; }
    .badge-unisex { background: rgba(255, 165, 0, 0.85); color: white; }

    .badge-stock {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .category-tag {
      font-size: 11px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .product-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 8px;
      line-height: 1.3;
    }

    .sizes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 16px 0;
    }

    .size-chip {
      background: #F2E6F2;
      color: var(--text-dark);
      padding: 3px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid #E2D2E2;
    }

    .card-footer {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px dashed #EAE0EA;
    }

    .price-tag {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-dark);
    }

    .price-tag span {
      color: var(--primary);
      font-size: 14px;
      margin-right: 2px;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    .btn-edit { background: #F0E6FF; color: var(--secondary); }
    .btn-edit:hover { background: var(--secondary); color: white; }
    .btn-delete { background: #FFE6E6; color: #FF3B3B; }
    .btn-delete:hover { background: #FF3B3B; color: white; }

    /* Modales Estilizados */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(30, 5, 32, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex !important;
      opacity: 1 !important;
      visibility: visible !important;
    }

    .modal-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 520px;
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.35);
      position: relative;
      max-height: 90vh;
      overflow-y: auto;
      z-index: 1000000;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-close-modal {
      background: #F4E8F4;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 16px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-close-modal:hover {
      background: #E5D0E5;
      color: var(--text-dark);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid #E2D2E2;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
      background: #FAF5FA;
      color: var(--text-dark);
    }

    .form-control:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(255, 20, 147, 0.12);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      padding: 14px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: var(--shadow-vivid);
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px dashed #D2B0D2;
    }

    .empty-state i {
      font-size: 50px;
      color: var(--primary);
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-dark);
      color: white;
      padding: 14px 24px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 700;
      z-index: 1000001;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .toast.active {
      transform: translateY(0);
      opacity: 1;
    }

    .toast i {
      color: #00FF9D;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="glow-sphere-1"></div>
  <div class="glow-sphere-2"></div>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo-brand">
        <div class="logo-icon">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
        <div class="logo-text">
          <h1>Urban Boutique</h1>
          <span>Catálogo Exclusivo</span>
        </div>
      </a>

      <div id="userBadgeArea">
        <button id="btnLoginTrigger" class="btn-login-icon" type="button" title="Acceso de Gestión">
          <i class="fa-solid fa-user-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="main-wrapper">
    <div class="hero-banner">
      <div class="hero-content">
        <h2>✨ Tendencias y Estilo Urbano ✨</h2>
        <p>Explora nuestra colección curada de calzado, prendas de alta calidad y accesorios vanguardistas para dama y caballero.</p>
      </div>
      <button id="btnAddProduct" class="btn-add-product" type="button">
        <i class="fa-solid fa-plus-circle"></i> Nuevo Producto
      </button>
    </div>

    <!-- Filters -->
    <div class="filters-section">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="todos" type="button">
          <i class="fa-solid fa-border-all"></i> Todos los Productos
        </button>
        <button class="tab-btn" data-category="zapatos" type="button">
          <i class="fa-solid fa-shoe-prints"></i> Zapatos
        </button>
        <button class="tab-btn" data-category="playeras_camisas" type="button">
          <i class="fa-solid fa-shirt"></i> Playeras y Camisas
        </button>
        <button class="tab-btn" data-category="pantalones" type="button">
          <i class="fa-solid fa-scissors"></i> Pantalones
        </button>
        <button class="tab-btn" data-category="accesorios_bolsas" type="button">
          <i class="fa-solid fa-bag-shopping"></i> Accesorios & Bolsas
        </button>
      </div>

      <div class="subfilters-bar">
        <div class="gender-toggle">
          <button class="gender-btn active" data-gender="todos" type="button">Todos</button>
          <button class="gender-btn" data-gender="dama" type="button">👩 Dama</button>
          <button class="gender-btn" data-gender="caballero" type="button">👨 Caballero</button>
        </div>

        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Buscar por nombre, código o talla...">
        </div>
      </div>
    </div>

    <!-- Product Grid -->
    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Modal: Agregar / Editar Producto -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="modalProductTitle">
          <i class="fa-solid fa-box-open" style="color: var(--primary);"></i>
          <span>Ingresar Producto</span>
        </div>
        <button class="btn-close-modal btn-close-prod-modal" type="button"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="productForm">
        <input type="hidden" id="prodId">

        <div class="form-group">
          <label for="prodName">Nombre del Producto</label>
          <input type="text" class="form-control" id="prodName" placeholder="Ej: Tacón Velvet Rosa / Playera Slim Fit" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodCategory">Categoría</label>
            <select class="form-control" id="prodCategory" required>
              <option value="zapatos">Zapatos</option>
              <option value="playeras_camisas">Playeras y Camisas</option>
              <option value="pantalones">Pantalones</option>
              <option value="accesorios_bolsas">Accesorios & Bolsas</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prodGender">Sección / Área</label>
            <select class="form-control" id="prodGender" required>
              <option value="dama">Dama</option>
              <option value="caballero">Caballero</option>
              <option value="unisex">Unisex</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="prodPrice">Precio (Quetzales Q)</label>
            <input type="number" step="0.01" class="form-control" id="prodPrice" placeholder="Q 150.00" required>
          </div>

          <div class="form-group">
            <label for="prodStock">Existencias (Stock)</label>
            <input type="number" class="form-control" id="prodStock" placeholder="10" required>
          </div>
        </div>

        <div class="form-group">
          <label for="prodSizes">Tallas Disponibles (Separadas por comas)</label>
          <input type="text" class="form-control" id="prodSizes" placeholder="Ej: 35, 36, 37 o S, M, L" required>
        </div>

        <div class="form-group">
          <label for="prodImg">URL de la Imagen</label>
          <input type="url" class="form-control" id="prodImg" placeholder="https://ejemplo.com/imagen.jpg">
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-floppy-disk"></i> Guardar Producto
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: Login Exclusivo para la Propietaria -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-user-shield" style="color: var(--secondary);"></i>
          <span>Acceso Propietaria</span>
        </div>
        <button class="btn-close-modal btn-close-login-modal" type="button"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="loginEmail">Correo Electrónico</label>
          <input type="email" class="form-control" id="loginEmail" placeholder="propietaria@urbanboutique.com" required>
        </div>

        <div class="form-group">
          <label for="loginPassword">Contraseña</label>
          <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Iniciar Sesión para Gestionar
        </button>
      </form>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toastMsg">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastText">Operación realizada con éxito</span>
  </div>

  <script>
    /* VARIABLES DE ESTADO Y SUPABASE */
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabase = null;

    try {
      if (window.supabase && typeof window.supabase.createClient === 'function') {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn('Modo local activo:', e);
    }

    let productsList = [
      {
        id: '1',
        nombre: 'Tacón Stiletto Velvet Rose',
        categoria: 'zapatos',
        genero: 'dama',
        precio: 345.00,
        stock: 12,
        tallas: ['35', '36', '37', '38'],
        imagen_url: 'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: '2',
        nombre: 'Mocasines Elegantes de Cuero',
        categoria: 'zapatos',
        genero: 'caballero',
        precio: 450.00,
        stock: 8,
        tallas: ['39', '40', '41', '42'],
        imagen_url: 'https://images.unsplash.com/photo-1614252235316-8c857d38b5f4?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: '3',
        nombre: 'Playera Casual Cotton Chic',
        categoria: 'playeras_camisas',
        genero: 'dama',
        precio: 125.00,
        stock: 20,
        tallas: ['S', 'M', 'L'],
        imagen_url: 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: '4',
        nombre: 'Bolso de Mano Elegante Coral',
        categoria: 'accesorios_bolsas',
        genero: 'dama',
        precio: 295.00,
        stock: 5,
        tallas: ['Única'],
        imagen_url: 'https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: '5',
        nombre: 'Pantalón Jeans High Waist',
        categoria: 'pantalones',
        genero: 'dama',
        precio: 220.00,
        stock: 15,
        tallas: ['28', '30', '32'],
        imagen_url: 'https://images.unsplash.com/photo-1541099649105-f69ad21f3246?auto=format&fit=crop&w=600&q=80'
      }
    ];

    let currentCategory = 'todos';
    let currentGender = 'todos';
    let currentUser = null;

    /* INICIALIZACIÓN CON EVENT LISTENERS ROBUSTOS (EVITA PROBLEMAS DE CLICKS) */
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Abrir modal login con el botón de ícono
      const btnLoginTrigger = document.getElementById('btnLoginTrigger');
      if (btnLoginTrigger) {
        btnLoginTrigger.addEventListener('click', (e) => {
          e.preventDefault();
          openLoginModal();
        });
      }

      // 2. Cerrar modales
      document.querySelectorAll('.btn-close-login-modal').forEach(btn => {
        btn.addEventListener('click', closeLoginModal);
      });
      document.querySelectorAll('.btn-close-prod-modal').forEach(btn => {
        btn.addEventListener('click', closeProductModal);
      });

      // 3. Cerrar al hacer clic fuera del contenido del modal (overlay)
      document.getElementById('loginModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('loginModal')) closeLoginModal();
      });
      document.getElementById('productModal').addEventListener('click', (e) => {
        if (e.target === document.getElementById('productModal')) closeProductModal();
      });

      // 4. Botón de agregar producto nuevo
      const btnAddProduct = document.getElementById('btnAddProduct');
      if (btnAddProduct) {
        btnAddProduct.addEventListener('click', () => openProductModal());
      }

      // 5. Pestañas de categoría
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          renderProducts();
        });
      });

      // 6. Botones de género
      document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGender = btn.getAttribute('data-gender');
          renderProducts();
        });
      });

      // 7. Buscador
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', () => renderProducts());
      }

      // 8. Formularios
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', handleLogin);
      }

      const productForm = document.getElementById('productForm');
      if (productForm) {
        productForm.addEventListener('submit', saveProduct);
      }

      // Cargar productos iniciales
      loadProductsFromSupabase();
    });

    /* FUNCIONES DE MODALES */
    function openLoginModal() {
      const modal = document.getElementById('loginModal');
      if (modal) {
        modal.style.display = 'flex';
        setTimeout(() => modal.classList.add('active'), 10);
      }
    }

    function closeLoginModal() {
      const modal = document.getElementById('loginModal');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 200);
      }
    }

    function openProductModal(prod = null) {
      const modal = document.getElementById('productModal');
      const form = document.getElementById('productForm');
      if (!modal) return;
      
      if (prod) {
        document.getElementById('modalProductTitle').innerHTML = `<i class="fa-solid fa-pen-to-square" style="color: var(--primary);"></i> <span>Editar Producto</span>`;
        document.getElementById('prodId').value = prod.id;
        document.getElementById('prodName').value = prod.nombre;
        document.getElementById('prodCategory').value = prod.categoria;
        document.getElementById('prodGender').value = prod.genero;
        document.getElementById('prodPrice').value = prod.precio;
        document.getElementById('prodStock').value = prod.stock;
        document.getElementById('prodSizes').value = Array.isArray(prod.tallas) ? prod.tallas.join(', ') : prod.tallas;
        document.getElementById('prodImg').value = prod.imagen_url || '';
      } else {
        document.getElementById('modalProductTitle').innerHTML = `<i class="fa-solid fa-box-open" style="color: var(--primary);"></i> <span>Ingresar Producto</span>`;
        if (form) form.reset();
        document.getElementById('prodId').value = '';
      }

      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeProductModal() {
      const modal = document.getElementById('productModal');
      if (modal) {
        modal.classList.remove('active');
        setTimeout(() => modal.style.display = 'none', 200);
      }
    }

    /* CARGA Y RENDERIZADO DE PRODUCTOS */
    async function loadProductsFromSupabase() {
      if (supabase) {
        try {
          const { data, error } = await supabase.from('productos').select('*');
          if (!error && data && data.length > 0) {
            productsList = data.map(item => ({
              ...item,
              tallas: typeof item.tallas === 'string' ? item.tallas.split(',').map(s => s.trim()) : item.tallas
            }));
          }
        } catch (e) {
          console.warn('Usando catálogo por defecto local');
        }
      }
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;

      const searchVal = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';

      const filtered = productsList.filter(p => {
        const matchesCategory = currentCategory === 'todos' || p.categoria === currentCategory;
        const matchesGender = currentGender === 'todos' || p.genero === currentGender;
        
        const tallasStr = Array.isArray(p.tallas) ? p.tallas.join(' ') : p.tallas;
        const matchesSearch = p.nombre.toLowerCase().includes(searchVal) || 
                              tallasStr.toLowerCase().includes(searchVal);

        return matchesCategory && matchesGender && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-box-open"></i>
            <h3>No se encontraron productos</h3>
            <p style="color: var(--text-muted); font-size: 14px;">Intenta cambiar los filtros o agrega un producto a esta sección.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const genderLabel = p.genero === 'dama' ? 'Dama' : (p.genero === 'caballero' ? 'Caballero' : 'Unisex');
        const badgeClass = p.genero === 'dama' ? 'badge-dama' : (p.genero === 'caballero' ? 'badge-caballero' : 'badge-unisex');
        const tallasArr = Array.isArray(p.tallas) ? p.tallas : p.tallas.split(',');
        const imgUrl = p.imagen_url || 'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80';

        return `
          <div class="product-card">
            <div class="card-img-wrapper">
              <img src="${imgUrl}" alt="${p.nombre}" onerror="this.src='https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80'">
              <span class="badge-gender ${badgeClass}">${genderLabel}</span>
              <span class="badge-stock"><i class="fa-solid fa-cubes"></i> ${p.stock} unid.</span>
            </div>
            
            <div class="card-body">
              <span class="category-tag">${p.categoria.replace('_', ' & ')}</span>
              <h3 class="product-title">${p.nombre}</h3>
              
              <div class="sizes-container">
                ${tallasArr.map(t => `<span class="size-chip">${t.trim()}</span>`).join('')}
              </div>

              <div class="card-footer">
                <div class="price-tag"><span>Q</span>${parseFloat(p.precio).toFixed(2)}</div>
                <div class="card-actions" style="display: ${currentUser ? 'flex' : 'none'};">
                  <button class="btn-icon btn-edit" onclick="editProduct('${p.id}')" title="Editar">
                    <i class="fa-solid fa-pen-to-square"></i>
                  </button>
                  <button class="btn-icon btn-delete" onclick="deleteProduct('${p.id}')" title="Eliminar">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    /* OPERACIONES CRUD DE PRODUCTOS */
    async function saveProduct(e) {
      e.preventDefault();
      
      const id = document.getElementById('prodId').value;
      const nombre = document.getElementById('prodName').value;
      const categoria = document.getElementById('prodCategory').value;
      const genero = document.getElementById('prodGender').value;
      const precio = parseFloat(document.getElementById('prodPrice').value);
      const stock = parseInt(document.getElementById('prodStock').value);
      const tallas = document.getElementById('prodSizes').value.split(',').map(s => s.trim());
      const imagen_url = document.getElementById('prodImg').value;

      const productPayload = { nombre, categoria, genero, precio, stock, tallas, imagen_url };

      if (id) {
        const index = productsList.findIndex(p => p.id === id);
        if (index !== -1) {
          productsList[index] = { ...productsList[index], ...productPayload };
        }
        if (supabase) {
          try { await supabase.from('productos').update(productPayload).eq('id', id); } catch(err){}
        }
        showToast('Producto actualizado correctamente');
      } else {
        const newId = Date.now().toString();
        const newProd = { id: newId, ...productPayload };
        productsList.unshift(newProd);

        if (supabase) {
          try { await supabase.from('productos').insert([productPayload]); } catch(err){}
        }
        showToast('Producto registrado exitosamente');
      }

      closeProductModal();
      renderProducts();
    }

    window.editProduct = function(id) {
      const prod = productsList.find(p => p.id === id);
      if (prod) openProductModal(prod);
    };

    window.deleteProduct = async function(id) {
      if (confirm('¿Estás segura de eliminar este producto del inventario?')) {
        productsList = productsList.filter(p => p.id !== id);
        if (supabase) {
          try { await supabase.from('productos').delete().eq('id', id); } catch(err){}
        }
        showToast('Producto eliminado del sistema');
        renderProducts();
      }
    };

    /* LOGIN Y GESTIÓN DE USUARIO */
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;

      currentUser = { email, name: 'Propietaria' };

      document.getElementById('userBadgeArea').innerHTML = `
        <div class="user-badge">
          <div class="user-avatar">P</div>
          <div class="user-info">
            <p>Propietaria</p>
            <span><i class="fa-solid fa-circle-check" style="color: #00FF9D;"></i> Modo Gestión</span>
          </div>
          <div class="user-actions">
            <button class="btn-user-action" id="btnLogout" title="Cerrar Sesión">
              <i class="fa-solid fa-power-off"></i>
            </button>
          </div>
        </div>
      `;

      // Vincular logout
      document.getElementById('btnLogout').addEventListener('click', logoutUser);

      const btnAdd = document.getElementById('btnAddProduct');
      if (btnAdd) btnAdd.style.display = 'flex';

      closeLoginModal();
      renderProducts();
      showToast('¡Sesión iniciada con éxito para gestión!');
    }

    function logoutUser() {
      currentUser = null;
      document.getElementById('userBadgeArea').innerHTML = `
        <button id="btnLoginTrigger" class="btn-login-icon" type="button" title="Acceso de Gestión">
          <i class="fa-solid fa-user-gear"></i>
        </button>
      `;

      // Reasignar evento al botón de icono de login restaurado
      const newLoginBtn = document.getElementById('btnLoginTrigger');
      if (newLoginBtn) {
        newLoginBtn.addEventListener('click', (e) => {
          e.preventDefault();
          openLoginModal();
        });
      }

      const btnAdd = document.getElementById('btnAddProduct');
      if (btnAdd) btnAdd.style.display = 'none';

      renderProducts();
      showToast('Sesión cerrada correctamente');
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      const toastText = document.getElementById('toastText');
      if (toast && toastText) {
        toastText.innerText = msg;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 3500);
      }
    }
  </script>
</body>
</html>
