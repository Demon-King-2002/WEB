<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario - Boutique Yesica</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B; --secondary: #D9C3B0; --bg-color: #FDFBF7; --card-bg: #FFFFFF;
      --border: #E5E5E5; --text-dark: #2B2B2B; --text-muted: #737373; --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; padding-bottom: 60px; }
    
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .back-link { text-decoration: none; color: var(--text-dark); font-weight: 700; font-size: 14px; }
    
    .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .summary-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
    .summary-card span { font-size: 12px; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 6px; text-transform: uppercase; }
    .summary-card b { font-size: 20px; font-weight: 800; color: var(--text-dark); }
    
    .table-wrapper { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead { background: var(--bg-color); border-bottom: 1px solid var(--border); }
    th { padding: 14px 16px; text-align: left; font-weight: 700; color: var(--text-muted); }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    
    .search-box { margin-bottom: 20px; display: flex; }
    .search-box input { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); outline: none; font-size: 14px; background: var(--card-bg); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="admin.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver al Panel</a>
      <div style="font-weight: 800;">Inventario Central</div>
      <button id="btnLogoutInv" style="background:none; border:none; cursor:pointer; font-weight:600;"><i class="fa-solid fa-power-off"></i></button>
    </div>
  </header>
  <main class="main-wrapper">
    <div class="summary-grid">
      <div class="summary-card"><span>Productos</span><b id="sumProductos">0</b></div>
      <div class="summary-card"><span>Unidades</span><b id="sumUnidades">0</b></div>
      <div class="summary-card"><span>Valor Venta</span><b id="sumValorVenta">Q0.00</b></div>
      <div class="summary-card"><span>Valor Costo</span><b id="sumValorCosto">Q0.00</b></div>
      <div class="summary-card"><span>Stock Bajo</span><b id="sumStockBajo">0</b></div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInv" placeholder="Buscar producto...">
    </div>
    <div class="table-wrapper">
      <table id="invTable">
        <thead>
          <tr>
            <th>Prod</th>
            <th>Nombre</th>
            <th>Cat</th>
            <th>Precio Venta</th>
            <th>Costo Unit.</th>
            <th>Stock</th>
            <th>Tallas</th>
          </tr>
        </thead>
        <tbody id="invTableBody"></tbody>
      </table>
    </div>
  </main>
  <script>
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let productos = [];

    async function cargarInventario() {
      const { data } = await supabaseClient.from('productos').select('*');
      if (data) { 
        productos = data; 
        renderSummary(); 
        renderTable(); 
      }
    }
    
    function renderTable() {
      const search = document.getElementById('searchInv').value.toLowerCase();
      const filtered = productos.filter(p => p.nombre.toLowerCase().includes(search));
      
      document.getElementById('invTableBody').innerHTML = filtered.map(p => {
        const tallasStr = Array.isArray(p.tallas) && p.tallas.length > 0 ? p.tallas.join(', ') : 'N/A';
        return `
          <tr>
            <td><img src="${p.imagen_url || ''}" style="width:30px; height:30px; object-fit:cover; border-radius:4px;"></td>
            <td><b>${p.nombre}</b></td>
            <td>${p.categoria}</td>
            <td>Q${Number(p.precio || 0).toFixed(2)}</td>
            <td>Q${Number(p.costo || 0).toFixed(2)}</td>
            <td>${p.stock}</td>
            <td>${tallasStr}</td>
          </tr>
        `;
      }).join('');
    }

    function renderSummary() {
      let totalUnidades = 0;
      let valorVentaTotal = 0;
      let valorCostoTotal = 0;
      let stockBajo = 0;

      productos.forEach(p => {
        const stock = parseInt(p.stock) || 0;
        const precio = parseFloat(p.precio) || 0;
        const costo = parseFloat(p.costo) || 0;

        totalUnidades += stock;
        valorVentaTotal += (precio * stock);
        valorCostoTotal += (costo * stock);
        if (stock < 5) stockBajo++;
      });

      document.getElementById('sumProductos').textContent = productos.length;
      document.getElementById('sumUnidades').textContent = totalUnidades;
      document.getElementById('sumValorVenta').textContent = `Q ${valorVentaTotal.toFixed(2)}`;
      document.getElementById('sumValorCosto').textContent = `Q ${valorCostoTotal.toFixed(2)}`;
      document.getElementById('sumStockBajo').textContent = stockBajo;
    }

    document.getElementById('searchInv').addEventListener('input', renderTable);
    document.getElementById('btnLogoutInv').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'admin.html';
    });
    
    cargarInventario();
  </script>
</body>
</html>
