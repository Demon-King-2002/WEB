<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Yesica - Admin PWA</title>
  
  <!-- Etiquetas PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2B2B2B">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1803/1803504.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --primary: #2B2B2B; --secondary: #D9C3B0; --bg-color: #FDFBF7; --card-bg: #FFFFFF;
      --border: #E5E5E5; --text-dark: #2B2B2B; --text-muted: #737373; --radius: 12px;
      --shadow: 0 8px 30px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; }
    
    .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; }
    .login-card { background: var(--card-bg); padding: 40px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { margin-bottom: 24px; font-weight: 800; }
    
    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; outline: none; background: var(--bg-color); }
    .form-control:focus { border-color: var(--primary); }
    
    .btn-submit { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn-submit:hover { background: #000; }
    
    #adminDashboard { display: none; padding-bottom: 60px; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .nav-links { display: flex; gap: 16px; }
    .nav-links a, .nav-links button { text-decoration: none; color: var(--text-dark); font-size: 13px; font-weight: 600; background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 6px; }
    .nav-links a:hover, .nav-links button:hover { background: var(--bg-color); }
    
    .dashboard-grid { max-width: 1200px; margin: 30px auto; padding: 0 16px; display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }
    
    .admin-card { background: var(--card-bg); padding: 24px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
    .admin-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    /* Product List for Admin to Edit/Delete */
    .admin-products-list { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .list-item { background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .list-info h4 { font-size: 15px; margin-bottom: 4px; }
    .list-info p { font-size: 12px; color: var(--text-muted); }
    .list-actions button { background: var(--bg-color); border: 1px solid var(--border); padding: 8px; border-radius: 6px; cursor: pointer; margin-left: 6px; }
    .list-actions button:hover { background: var(--secondary); color: white; border-color: var(--secondary); }
  </style>
</head>
<body>

  <div id="loginSection" class="login-container">
    <div class="login-card">
      <h2>Acceso Administrativo</h2>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login_email">Correo Electrónico</label>
          <input type="email" class="form-control" id="login_email" placeholder="admin@miboutique.com" required>
        </div>
        <div class="form-group">
          <label for="login_password">Contraseña</label>
          <input type="password" class="form-control" id="login_password" required>
        </div>
        <button type="submit" class="btn-submit">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <div id="adminDashboard">
    <header>
      <div style="font-weight: 800; font-size: 18px;">Boutique Yesica <span style="color: var(--text-muted); font-size:12px;">PWA</span></div>
      <div class="nav-links">
        <a href="inventario.html"><i class="fa-solid fa-warehouse"></i> Inventario</a>
        <a href="administracion.html"><i class="fa-solid fa-chart-line"></i> Finanzas</a>
        <button id="btnLogout" onclick="logoutUser()"><i class="fa-solid fa-power-off"></i> Salir</button>
      </div>
    </header>

    <div class="dashboard-grid">
      <!-- Formulario intacto para ingresar producto -->
      <div class="admin-card">
        <h3><i class="fa-solid fa-box-open"></i> Ingresar / Editar Producto</h3>
        <form id="productForm">
          <input type="hidden" id="prodId">
          <input type="hidden" id="prodImgUrl">

          <div class="form-group">
            <label for="prodName">Nombre del Producto</label>
            <input type="text" class="form-control" id="prodName" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prodCategory">Categoría</label>
              <select class="form-control" id="prodCategory" required>
                <option value="zapatos">Zapatos</option>
                <option value="playeras">Playeras</option>
                <option value="pantalones">Pantalones</option>
                <option value="vestidos">Vestidos</option>
                <option value="accesorios">Accesorios</option>
              </select>
            </div>
            <div class="form-group">
              <label for="prodGender">Género</label>
              <select class="form-control" id="prodGender" required>
                <option value="dama">Dama</option>
                <option value="caballero">Caballero</option>
                <option value="unisex">Unisex</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prodPrice">Precio (Q)</label>
              <input type="number" step="0.01" class="form-control" id="prodPrice" required>
            </div>
            <div class="form-group">
              <label for="prodCost">Costo (Q)</label>
              <input type="number" step="0.01" class="form-control" id="prodCost">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prodStock">Existencias</label>
              <input type="number" class="form-control" id="prodStock" required>
            </div>
            <div class="form-group">
              <label for="prodSizes">Tallas (comas)</label>
              <input type="text" class="form-control" id="prodSizes" required>
            </div>
          </div>

          <div class="form-group">
            <label for="prodImgFile">Fotografía</label>
            <input type="file" accept="image/*" class="form-control" id="prodImgFile">
          </div>

          <button type="submit" class="btn-submit" id="btnSubmitProd">Guardar Producto</button>
        </form>
      </div>

      <!-- Formulario intacto para salida de producto -->
      <div class="admin-card">
        <h3><i class="fa-solid fa-truck-ramp-box"></i> Registrar Salida</h3>
        <form id="salidaForm">
          <div class="form-group">
            <label for="salidaProducto">Producto</label>
            <select class="form-control" id="salidaProducto" required></select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="salidaCantidad">Cantidad</label>
              <input type="number" min="1" class="form-control" id="salidaCantidad" value="1" required>
            </div>
            <div class="form-group">
              <label for="salidaMotivo">Motivo</label>
              <select class="form-control" id="salidaMotivo" required>
                <option value="venta">Venta</option>
                <option value="dañado">Dañado</option>
                <option value="perdida">Pérdida</option>
                <option value="ajuste">Ajuste</option>
                <option value="otro">Otro</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-submit" id="btnSubmitSalida">Registrar Salida</button>
        </form>
      </div>
    </div>
    
    <div class="admin-products-list" id="productsGrid"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = null;
    let currentUser = null;
    let productsList = [];

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
          auth: {
            persistSession: true,
            autoRefreshToken: true
          }
        });
      }
    } catch (e) { console.error(e); }

    document.addEventListener('DOMContentLoaded', async () => {
      if (supabaseClient) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (user) {
          currentUser = user;
          updateUIAfterLogin();
        }
      }
      document.getElementById('productForm').addEventListener('submit', saveProduct);
      document.getElementById('salidaForm').addEventListener('submit', registrarSalida);
    });

    async function handleLogin(event) {
      event.preventDefault();
      const email = document.getElementById('login_email').value;
      const password = document.getElementById('login_password').value;
      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
        updateUIAfterLogin();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }

    function updateUIAfterLogin() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminDashboard').style.display = 'block';
      loadProductsFromSupabase();
    }

    async function logoutUser() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      document.getElementById('loginSection').style.display = 'flex';
      document.getElementById('adminDashboard').style.display = 'none';
    }

    async function loadProductsFromSupabase() {
      if (supabaseClient) {
        const { data, error } = await supabaseClient.from('productos').select('*');
        if (!error && data) {
          productsList = data.map(item => ({
            ...item, tallas: typeof item.tallas === 'string' ? item.tallas.split(',').map(s => s.trim()) : item.tallas
          }));
        }
      }
      renderProducts();
      actualizarSelectSalidas();
    }

    function actualizarSelectSalidas() {
      const select = document.getElementById('salidaProducto');
      select.innerHTML = productsList.map(p => `<option value="${p.id}">${p.nombre} (Stock: ${p.stock})</option>`).join('');
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = productsList.map(p => `
        <div class="list-item">
          <div class="list-info">
            <h4>${p.nombre}</h4>
            <p>Q${p.precio} | Stock: ${p.stock} | Cat: ${p.categoria}</p>
          </div>
          <div class="list-actions">
            <button onclick="editProduct('${p.id}')"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteProduct('${p.id}')"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    window.editProduct = function(id) {
      const prod = productsList.find(p => p.id === id);
      if (prod) {
        document.getElementById('prodId').value = prod.id;
        document.getElementById('prodName').value = prod.nombre;
        document.getElementById('prodCategory').value = prod.categoria;
        document.getElementById('prodGender').value = prod.genero;
        document.getElementById('prodPrice').value = prod.precio;
        document.getElementById('prodCost').value = prod.costo || '';
        document.getElementById('prodStock').value = prod.stock;
        document.getElementById('prodSizes').value = Array.isArray(prod.tallas) ? prod.tallas.join(', ') : prod.tallas;
        document.getElementById('prodImgUrl').value = prod.imagen_url || '';
        window.scrollTo(0,0);
      }
    };

    window.deleteProduct = async function(id) {
      if (confirm('¿Eliminar producto?')) {
        if (supabaseClient) {
          await supabaseClient.from('productos').delete().eq('id', id);
        }
        productsList = productsList.filter(p => p.id !== id);
        renderProducts();
        actualizarSelectSalidas();
      }
    };

    async function saveProduct(e) {
      e.preventDefault();
      const btnSubmit = document.getElementById('btnSubmitProd');
      btnSubmit.disabled = true;
      try {
        const id = document.getElementById('prodId').value;
        const nombre = document.getElementById('prodName').value;
        const categoria = document.getElementById('prodCategory').value;
        const genero = document.getElementById('prodGender').value;
        const precio = parseFloat(document.getElementById('prodPrice').value);
        const costo = parseFloat(document.getElementById('prodCost').value) || 0;
        const stock = parseInt(document.getElementById('prodStock').value);
        const tallas = document.getElementById('prodSizes').value.split(',').map(s => s.trim());
        let imagen_url = document.getElementById('prodImgUrl').value;
        const fileInput = document.getElementById('prodImgFile');

        if (fileInput.files.length > 0 && supabaseClient) {
          const file = fileInput.files[0];
          const fileName = `${Date.now()}_${file.name}`;
          await supabaseClient.storage.from('productos').upload(fileName, file);
          const { data } = supabaseClient.storage.from('productos').getPublicUrl(fileName);
          imagen_url = data.publicUrl;
        }

        const payload = { nombre, categoria, genero, precio, costo, stock, tallas, imagen_url };
        if (id) {
          await supabaseClient.from('productos').update(payload).eq('id', id);
        } else {
          await supabaseClient.from('productos').insert([payload]);
        }
        
        document.getElementById('productForm').reset();
        document.getElementById('prodId').value = '';
        await loadProductsFromSupabase();
        alert("Producto guardado");
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        btnSubmit.disabled = false;
      }
    }

    async function registrarSalida(event) {
      event.preventDefault();
      const select = document.getElementById('salidaProducto');
      const cantidad = parseInt(document.getElementById('salidaCantidad').value);
      const motivo = document.getElementById('salidaMotivo').value;
      const prod = productsList.find(p => p.id === select.value);

      if (!prod || cantidad > prod.stock) { alert('Stock insuficiente'); return; }

      const nuevoStock = prod.stock - cantidad;
      try {
        if (supabaseClient) {
          await supabaseClient.from('ventas').insert([{
            producto_id: prod.id, producto_nombre: prod.nombre, cantidad, 
            precio_unitario: prod.precio, costo_unitario: prod.costo || 0, motivo
          }]);
          await supabaseClient.from('productos').update({ stock: nuevoStock }).eq('id', prod.id);
        }
        await loadProductsFromSupabase();
        alert('Salida registrada');
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
  
  <!-- Control de Acceso con Supabase y Registro PWA -->
<script>
  // 1. CREDENCIALES DE SUPABASE
  const PWA_SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
  const PWA_SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
  
  const supabase = window.supabase.createClient(PWA_SUPABASE_URL, PWA_SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true
    }
  });

  // 2. ELEMENTOS DE LA INTERFAZ
  const loginSection = document.querySelector('input[type="email"]')?.closest('div') || document.querySelector('form')?.parentElement;
  const adminPanel = document.querySelector('h3')?.closest('div') || document.getElementById('panel-admin');
  
  const emailInput = document.querySelector('input[type="email"]');
  const passwordInput = document.querySelector('input[type="password"]');
  
  const loginBtn = Array.from(document.querySelectorAll('button, input[type="submit"]')).find(el => el.textContent.includes('Iniciar Sesión'));
  const logoutBtn = Array.from(document.querySelectorAll('a, button')).find(el => el.textContent.includes('Salir'));

  // 3. EVENTO DE CARGA DE PÁGINA
  window.addEventListener('load', () => {
    // Mantener registro del Service Worker de la PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registrado con éxito:', reg.scope))
        .catch(err => console.error('Error al registrar SW:', err));
    }

    // Retraso para que la persistencia local recupere la sesión en móviles
    setTimeout(async () => {
      const { data: { session } } = await supabase.auth.getSession();
      actualizarVista(session);
    }, 100);
  });

  function actualizarVista(session) {
    if (session) {
      if (loginSection) loginSection.style.display = 'none';
      if (adminPanel) adminPanel.style.display = 'block';
    } else {
      if (loginSection) loginSection.style.display = 'block';
      if (adminPanel) adminPanel.style.display = 'none';
    }
  }

  // 4. ACCIÓN DEL BOTÓN INICIAR SESIÓN
  if (loginBtn) {
    loginBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      
      const email = emailInput?.value.trim();
      const password = passwordInput?.value.trim();

      if (!email || !password) {
        alert("Por favor, introduce tu correo y contraseña.");
        return;
      }

      const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        alert("Acceso denegado: " + error.message);
      } else {
        alert("¡Bienvenida de nuevo, Yesica!");
        actualizarVista(data.session);
      }
    });
  }

  // 5. ACCIÓN DEL BOTÓN SALIR / CERRAR SESIÓN
  if (logoutBtn) {
    logoutBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      await supabase.auth.signOut();
      window.location.reload(); 
    });
  }
</script>

</body>
</html>
