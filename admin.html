<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Salidas de Inventario y Fotos</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B;
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --border: #E5E5E5;
      --text-dark: #2B2B2B;
      --text-muted: #737373;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); padding: 20px; }
    .admin-container { max-width: 900px; margin: 0 auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); }
    h2 { font-size: 20px; font-weight: 800; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    
    /* Estructura para Salidas de Inventario con la miniatura debajo de Prod */
    .salida-row { display: flex; justify-content: space-between; align-items: center; background: #FAFAFA; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 10px; }
    .prod-label-group { display: flex; flex-direction: column; }
    .prod-header-title { font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .prod-name { font-weight: 700; font-size: 14px; color: var(--text-dark); margin: 2px 0; }
    
    /* Miniatura debajo de Prod */
    .inventario-miniatura { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; margin-bottom: 6px; }
    
    .admin-gallery { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .admin-thumb-box { position: relative; }
    .admin-thumb-img { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
    .btn-del { position: absolute; top: -6px; right: -6px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    
    .btn-action { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .upload-btn-label { display: inline-flex; align-items: center; gap: 6px; background: #F0EDE6; border: 1px dashed var(--border); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: 600; color: var(--text-dark); margin-top: 8px; width: fit-content; }
  </style>
</head>
<body>
  <div class="admin-container">
    <h2><i class="fa-solid fa-boxes-stacked"></i> Administración - Salidas de Inventario</h2>
    <div id="adminSalidasList">Cargando inventario...</div>
  </div>

  <script>
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    const STORAGE_BUCKET = 'productos-img';
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error(e); }

    let productsList = [];

    document.addEventListener('DOMContentLoaded', loadAdminProducts);

    async function loadAdminProducts() {
      if (!supabaseClient) return;
      const { data, error } = await supabaseClient.from('productos').select('*');
      if (error) {
        console.error(error);
        return;
      }
      if (data) {
        productsList = data.map(item => {
          let imgs = [];
          if (item.imagen_url) {
            imgs = item.imagen_url.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
          }
          return { ...item, imagenes: imgs };
        });
      }
      renderAdminInventario();
    }

    async function adminAgregarMultiplesFotos(productId, fileList) {
      if (!supabaseClient || !fileList || fileList.length === 0) return;
      const producto = productsList.find(p => p.id == productId);
      if (!producto) return;

      let nuevasUrls = [];
      for (let i = 0; i < fileList.length; i++) {
        const archivo = fileList[i];
        const fileName = `prod_${Date.now()}_${i}_${Math.random().toString(36).substring(2, 6)}`;
        
        const { error: uploadError } = await supabaseClient.storage
          .from(STORAGE_BUCKET)
          .upload(fileName, archivo);

        if (!uploadError) {
          const { data: publicUrlData } = supabaseClient.storage
            .from(STORAGE_BUCKET)
            .getPublicUrl(fileName);
          
          if (publicUrlData?.publicUrl) {
            nuevasUrls.push(publicUrlData.publicUrl);
          }
        }
      }

      let fotosFinales = [...producto.imagenes, ...nuevasUrls];
      let imagenUrlString = fotosFinales.join(',');

      const { error: updateError } = await supabaseClient
        .from('productos')
        .update({ imagen_url: imagenUrlString })
        .eq('id', productId);

      if (!updateError) {
        await loadAdminProducts();
      } else {
        alert("Error al actualizar las imágenes en la base de datos.");
      }
    }

    async function adminEliminarFoto(productId, indexParaBorrar) {
      const producto = productsList.find(p => p.id == productId);
      if (!producto) return;

      let fotosActualizadas = producto.imagenes.filter((_, idx) => idx !== indexParaBorrar);
      let imagenUrlString = fotosActualizadas.join(',');

      const { error } = await supabaseClient
        .from('productos')
        .update({ imagen_url: imagenUrlString })
        .eq('id', productId);

      if (!error) {
        await loadAdminProducts();
      } else {
        alert("No se pudo eliminar la imagen.");
      }
    }

    function renderAdminInventario() {
      const container = document.getElementById('adminSalidasList');
      if (!container) return;

      if (productsList.length === 0) {
        container.innerHTML = `<p>No hay productos registrados.</p>`;
        return;
      }

      container.innerHTML = productsList.map(p => {
        const fotoPrincipal = p.imagenes.length > 0 ? p.imagenes[0] : '';
        return `
          <div class="salida-row">
            <div class="prod-label-group">
              <span class="prod-header-title">Prod</span>
              ${fotoPrincipal ? `<img src="${fotoPrincipal}" class="inventario-miniatura" alt="Miniatura">` : '<span style="font-size:11px; color:#999; margin:4px 0;">Sin foto</span>'}
              <div class="prod-name">${p.nombre} (Stock: ${p.stock})</div>
              
              <div class="admin-gallery">
                ${p.imagenes.map((img, idx) => `
                  <div class="admin-thumb-box">
                    <img src="${img}" class="admin-thumb-img" alt="Foto">
                    <button type="button" class="btn-del" onclick="adminEliminarFoto('${p.id}', ${idx})" title="Eliminar foto">×</button>
                  </div>
                `).join('')}
              </div>

              <label class="upload-btn-label">
                <i class="fa-solid fa-cloud-arrow-up"></i> Agregar fotos (Múltiple)
                <input type="file" accept="image/*" multiple style="display: none;" onchange="adminAgregarMultiplesFotos('${p.id}', this.files)">
              </label>
            </div>
            <div>
              <button type="button" class="btn-action" onclick="alert('Salida procesada para ${p.nombre}')">Dar Salida</button>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
