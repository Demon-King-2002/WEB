<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Yesica - Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B;
      --secondary: #D9C3B0;
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --border: #E5E5E5;
      --text-dark: #2B2B2B;
      --text-muted: #737373;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; padding-bottom: 50px; }
    
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: center; align-items: center; }
    .logo-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-text h1 { font-size: 24px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
    .logo-text span { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
    
    .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    .hero-banner { background: var(--secondary); border-radius: var(--radius); padding: 40px; text-align: center; margin-bottom: 30px; }
    .hero-banner h2 { font-size: 28px; font-weight: 800; color: var(--text-dark); margin-bottom: 10px; }
    .hero-banner p { font-size: 15px; color: var(--text-dark); opacity: 0.8; }
    
    .filters-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 30px; }
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .tab-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-dark); padding: 10px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .tab-btn:hover { border-color: var(--primary); }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    /* Fila estética de botones para género */
    .gender-tabs { display: flex; gap: 10px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
    .gender-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-dark); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .gender-btn:hover { border-color: var(--primary); }
    .gender-btn.active { background: var(--secondary); color: var(--text-dark); border-color: var(--secondary); font-weight: 700; }

    .search-box { position: relative; margin-top: 16px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 30px; border: 1px solid var(--border); font-size: 14px; outline: none; background: var(--bg-color); }
    .search-box input:focus { border-color: var(--primary); }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }
    
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: transform 0.2s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .card-img-wrapper { width: 100%; height: 220px; background: #F5F5F5; position: relative; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge-stock { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); color: var(--text-dark); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); }
    
    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .category-tag { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .product-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; line-height: 1.3; }
    .sizes-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .size-chip { background: var(--bg-color); color: var(--text-dark); padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); }
    
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .price-tag { font-size: 18px; font-weight: 800; color: var(--text-dark); }
    .price-tag span { font-size: 13px; color: var(--text-muted); margin-right: 2px; }
    
    .btn-whatsapp { background: var(--primary); color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 13px; font-weight: 600; transition: background 0.2s; }
    .btn-whatsapp:hover { background: #000; }
    
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo-brand">
        <div class="logo-text">
          <h1>Boutique Yesica</h1>
          <span>Catálogo Exclusivo</span>
        </div>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="hero-banner">
      <h2>Descubre la nueva colección</h2>
      <p>Elegancia, comodidad y estilo en un solo lugar.</p>
    </div>

    <div class="filters-section">
      <!-- Filtros de Categoría -->
      <div class="category-tabs">
        <button class="tab-btn active" data-category="todos" type="button">Todos</button>
        <button class="tab-btn" data-category="zapatos" type="button">👟 Zapatos</button>
        <button class="tab-btn" data-category="playeras" type="button">👕 Playeras</button>
        <button class="tab-btn" data-category="pantalones" type="button">👖 Pantalones</button>
        <button class="tab-btn" data-category="vestidos" type="button">👗 Vestidos</button>
        <button class="tab-btn" data-category="accesorios" type="button">👜 Accesorios</button>
      </div>

      <!-- Filtros de Género Minimalistas -->
      <div class="gender-tabs">
        <button class="gender-btn active" data-gender="todos" type="button">Todos los géneros</button>
        <button class="gender-btn" data-gender="dama" type="button">Dama</button>
        <button class="gender-btn" data-gender="caballero" type="button">Caballero</button>
        <button class="gender-btn" data-gender="unisex" type="button">Unisex</button>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nombre o talla...">
      </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <script>
    const WHATSAPP_NUMBER = '50233582829';
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error("Error inicializando Supabase:", e); }

    let productsList = [];
    let currentCategory = 'todos';
    let currentGender = 'todos';

    document.addEventListener('DOMContentLoaded', () => {
      // Eventos para pestañas de categoría
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          renderProducts();
        });
      });

      // Eventos para pestañas de género
      document.querySelectorAll('.gender-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.gender-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentGender = btn.getAttribute('data-gender');
          renderProducts();
        });
      });

      document.getElementById('searchInput').addEventListener('input', renderProducts);
      loadProductsFromSupabase();
    });

    async function loadProductsFromSupabase() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient.from('productos').select('*');
          if (!error && data) {
            productsList = data.map(item => ({
              ...item,
              tallas: typeof item.tallas === 'string' ? item.tallas.split(',').map(s => s.trim()) : item.tallas
            }));
          }
        } catch (e) { console.error(e); }
      }
      renderProducts();
    }

    function formatNumber(num) {
      let val = Number(num);
      return (val % 1 === 0) ? val.toString() : val.toFixed(2);
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = productsList.filter(p => {
        const matchesCategory = currentCategory === 'todos' || (p.categoria && p.categoria.toLowerCase() === currentCategory);
        const matchesGender = currentGender === 'todos' || (p.genero && p.genero.toLowerCase() === currentGender);
        
        const tallasStr = Array.isArray(p.tallas) ? p.tallas.join(' ') : (p.tallas || '');
        const matchesSearch = p.nombre.toLowerCase().includes(searchVal) || tallasStr.toLowerCase().includes(searchVal);
        
        return matchesCategory && matchesGender && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>No se encontraron productos</h3></div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const tallasArr = Array.isArray(p.tallas) ? p.tallas : (p.tallas ? p.tallas.split(',') : []);
        const imgUrl = p.imagen_url || 'https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80';
        const whatsappMsg = `Hola! Me interesa: ${p.nombre} (Q${formatNumber(p.precio)}).`;
        
        return `
          <div class="product-card">
            <div class="card-img-wrapper">
              <img src="${imgUrl}" alt="${p.nombre}">
              <span class="badge-stock">Disp: ${p.stock}</span>
            </div>
            <div class="card-body">
              <span class="category-tag">${p.categoria} - ${p.genero || ''}</span>
              <h3 class="product-title">${p.nombre}</h3>
              <div class="sizes-container">
                ${tallasArr.map(t => `<span class="size-chip">${t.trim()}</span>`).join('')}
              </div>
              <div class="card-footer">
                <div class="price-tag"><span>Q</span>${formatNumber(p.precio)}</div>
                <a href="https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(whatsappMsg)}" target="_blank" class="btn-whatsapp">
                  Lo quiero
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
