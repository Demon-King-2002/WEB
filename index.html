<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URBANSTORE - Premium Imports</title>
    
    <!-- Tailwind CSS (CDN) para diseño responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Estilos base */
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f9fafb; }
        .glass-modal { background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(5px); }
        .loader { border-top-color: #000; -webkit-animation: spinner 1s linear infinite; animation: spinner 1s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* Ocultar elementos */
        .hidden { display: none !important; }
        /* Botones de talla activos */
        .size-btn.active { background-color: #000; color: #fff; border-color: #000; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col relative">

    <!-- Navbar Pública -->
    <nav class="bg-black text-white sticky top-0 z-40 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo: Al hacer UN CLIC abre el modal de Login -->
                <div class="flex-shrink-0 flex items-center cursor-pointer select-none" onclick="openLoginModal()">
                    <span class="font-bold text-xl tracking-widest uppercase">URBAN<span class="text-gray-400">STORE</span></span>
                </div>
                <!-- Buscador en tiempo real -->
                <div class="flex-1 max-w-md mx-4">
                    <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Buscar marca o producto..." 
                        class="w-full bg-gray-800 text-white border border-gray-700 rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-gray-400 transition-all text-sm">
                </div>
                <!-- Botón de Panel Admin (visible solo al iniciar sesión) -->
                <button id="btnAdminPanel" onclick="toggleViews()" class="hidden bg-white text-black px-4 py-2 rounded-full text-sm font-semibold hover:bg-gray-200 transition">
                    Panel Admin
                </button>
            </div>
        </div>
    </nav>

    <!-- 1. MODAL HTML OCULTO PARA EL LOGIN -->
    <div id="loginModal" class="fixed inset-0 z-50 glass-modal hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-gray-400 hover:text-black text-2xl font-bold leading-none">&times;</button>
            <h2 class="text-2xl font-bold text-center mb-6 text-black">Acceso Seguro</h2>
            
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
                    <input type="email" id="login_email" required autocomplete="email" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="login_password" required autocomplete="current-password" class="w-full border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                </div>
                <p id="loginError" class="text-red-500 text-sm font-semibold hidden text-center"></p>
                <button type="submit" id="btnLoginSubmit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition">
                    Iniciar Sesión
                </button>
            </form>
        </div>
    </div>

    <!-- Contenedor Principal (Catálogo Público) -->
    <main id="public-view" class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div id="loader" class="flex justify-center items-center py-20 hidden">
            <div class="loader ease-linear rounded-full border-4 border-t-4 h-12 w-12 mb-4"></div>
        </div>
        
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
            <!-- Renderizado de productos vía JS -->
        </div>
        
        <div id="empty-state" class="hidden text-center py-20 text-gray-500 font-medium">
            No se encontraron productos en el catálogo.
        </div>
    </main>

    <!-- Panel de Administración (Protegido y oculto por defecto) -->
    <main id="admin-view" class="hidden flex-1 max-w-5xl mx-auto px-4 py-8 w-full">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900">Gestión de Inventario</h2>
            <button onclick="logout()" class="text-red-500 font-bold hover:underline flex items-center gap-2">
                Cerrar Sesión
            </button>
        </div>

        <!-- Formulario para Agregar/Editar -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 mb-8">
            <h3 class="text-lg font-bold mb-4 border-b pb-2" id="form-title">Agregar Nuevo Producto</h3>
            <form id="productForm" onsubmit="handleProductSubmit(event)" class="space-y-4">
                <input type="hidden" id="editProductId">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Marca</label>
                        <input type="text" id="p_brand" required class="w-full border-gray-300 border rounded-lg p-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre / Modelo</label>
                        <input type="text" id="p_name" required class="w-full border-gray-300 border rounded-lg p-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($ / Q)</label>
                        <input type="number" step="0.01" id="p_price" required class="w-full border-gray-300 border rounded-lg p-2 focus:ring-black">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tallas (Separadas por comas)</label>
                        <input type="text" id="p_sizes" placeholder="Ej: 7, 8, 9 o S, M, L" required class="w-full border-gray-300 border rounded-lg p-2 focus:ring-black">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Foto (Usar cámara del celular o galería)</label>
                    <input type="file" id="p_image" accept="image/*" class="w-full border-gray-300 border rounded-lg p-2 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-black file:text-white hover:file:bg-gray-800 cursor-pointer">
                </div>
                <button type="submit" id="btnSubmitProduct" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition shadow-lg mt-4">
                    Guardar y Publicar
                </button>
            </form>
        </div>

        <!-- Lista de Inventario -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold mb-4 border-b pb-2">Catálogo Actual</h3>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead>
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Producto</th>
                            <th class="px-4 py-3 text-left text-xs font-bold text-gray-500 uppercase">Precio</th>
                            <th class="px-4 py-3 text-right text-xs font-bold text-gray-500 uppercase">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="admin-products-list" class="divide-y divide-gray-200">
                        <!-- Renderizado de tabla admin -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Dinámico de Checkout (Público) -->
    <div id="productModal" class="fixed inset-0 z-50 glass-modal hidden flex flex-col justify-end sm:justify-center p-0 sm:p-4 transition-all">
        <div class="bg-white w-full sm:max-w-md sm:mx-auto rounded-t-3xl sm:rounded-3xl overflow-hidden shadow-2xl relative flex flex-col max-h-[90vh]">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 bg-black bg-opacity-70 text-white rounded-full w-8 h-8 flex items-center justify-center hover:bg-opacity-100 z-10 font-bold">&times;</button>
            
            <div class="h-64 sm:h-80 w-full bg-gray-50 flex-shrink-0 relative">
                <img id="modal-img" src="" alt="Producto" class="w-full h-full object-contain">
            </div>
            
            <div class="p-6 flex-1 overflow-y-auto">
                <p id="modal-brand" class="text-xs font-bold text-gray-500 uppercase tracking-widest"></p>
                <h2 id="modal-name" class="text-2xl font-black text-gray-900 mt-1 mb-1 leading-tight"></h2>
                <p id="modal-price" class="text-3xl font-bold text-black mb-6"></p>
                
                <h3 class="text-sm font-bold text-gray-900 uppercase mb-3 border-b pb-2">1. Elige tu talla</h3>
                <div id="modal-sizes" class="flex flex-wrap gap-2 mb-8">
                    <!-- Botones de tallas dinámicos -->
                </div>
                
                <button onclick="redirectToWhatsApp()" class="w-full bg-[#25D366] text-white font-bold text-lg py-4 rounded-xl flex justify-center items-center gap-3 hover:bg-[#128C7E] shadow-lg shadow-green-200 transition-all">
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12.031 0C5.385 0 0 5.385 0 12.031c0 2.128.555 4.195 1.611 6.012L.217 23.783l5.881-1.385c1.748.966 3.738 1.474 5.922 1.474 6.645 0 12.03-5.384 12.03-12.03S17.43 0 12.031 0zm7.135 17.194c-.302.846-1.748 1.62-2.392 1.67-.626.048-1.428.182-4.593-1.052-3.805-1.484-6.26-5.35-6.446-5.596-.182-.246-1.536-2.046-1.536-3.904 0-1.859.968-2.775 1.316-3.14.347-.367.754-.457 1.004-.457.25 0 .5.004.72.015.228.01.53.084.827.804.376.906 1.277 3.123 1.388 3.344.11.222.182.477.037.766-.145.292-.222.468-.442.723-.222.257-.468.56-.67.74-.216.19-.444.402-.2.812.245.41 1.09 1.785 2.342 2.903 1.616 1.442 2.96 1.884 3.376 2.078.415.195.66.155.908-.124.247-.28 1.066-1.243 1.35-1.67.284-.428.567-.356.945-.213.378.143 2.392 1.13 2.802 1.332.41.204.683.307.784.478.1.173.1.996-.202 1.842z"/></svg>
                    Pedir por WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL: Lógica, Seguridad y Base de Datos -->
    <script>
        // =========================================================
        // 1. CONFIGURACIÓN DE SUPABASE Y SISTEMA
        // =========================================================
        const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
        
        // Número de WhatsApp del negocio (Ej. Guatemala: 502 + Número)
        const WHATSAPP_NUMBER = '50200000000'; 
        
        // Inicialización segura del cliente (Usa LocalStorage para Tokens de Sesión)
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Variables de estado
        let globalProducts = [];
        let currentProduct = null;
        let currentSelectedSize = null;

        // =========================================================
        // 2. CICLO DE VIDA, EVENTOS Y SUSCRIPCIONES
        // =========================================================
        window.addEventListener('DOMContentLoaded', async () => {
            await checkSession();
            fetchProducts();

            // Sincronización Real-Time con CDN Supabase:
            // Permite que clientes de todo el mundo vean actualizaciones en tiempo real.
            supabase.channel('public:products')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                    fetchProducts();
                })
                .subscribe();
        });

        // =========================================================
        // 3. FUNCIONES DEL MODAL DE LOGIN (HTML)
        // =========================================================
        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginError').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        // =========================================================
        // 4. AUTENTICACIÓN Y SESIONES SECURE-END-TO-END
        // =========================================================
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            const btnAdmin = document.getElementById('btnAdminPanel');
            if (session) {
                btnAdmin.classList.remove('hidden');
            } else {
                btnAdmin.classList.add('hidden');
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('public-view').classList.remove('hidden');
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login_email').value;
            const password = document.getElementById('login_password').value;
            const errorEl = document.getElementById('loginError');
            const btn = document.getElementById('btnLoginSubmit');
            
            btn.textContent = "Verificando...";
            btn.disabled = true;

            // Envío seguro de hash; no expone credenciales localmente
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                errorEl.textContent = 'Credenciales inválidas. Acceso denegado.';
                errorEl.classList.remove('hidden');
                btn.textContent = "Iniciar Sesión";
                btn.disabled = false;
            } else {
                closeLoginModal();
                await checkSession();
                toggleViews(true); // Fuerza abrir el panel admin
                btn.textContent = "Iniciar Sesión";
                btn.disabled = false;
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            await checkSession();
        }

        function toggleViews(forceAdmin = false) {
            const adminView = document.getElementById('admin-view');
            const publicView = document.getElementById('public-view');
            
            if (forceAdmin || adminView.classList.contains('hidden')) {
                adminView.classList.remove('hidden');
                publicView.classList.add('hidden');
            } else {
                adminView.classList.add('hidden');
                publicView.classList.remove('hidden');
            }
        }

        // =========================================================
        // 5. OBTENER PRODUCTOS DEL SERVIDOR CDN
        // =========================================================
        async function fetchProducts() {
            document.getElementById('loader').classList.remove('hidden');
            const { data, error } = await supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            document.getElementById('loader').classList.add('hidden');
            
            if (error) return console.error('Error fetching data:', error);
            
            globalProducts = data || [];
            renderProducts(globalProducts);
            renderAdminProducts(globalProducts);
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalProducts.filter(p => 
                p.name.toLowerCase().includes(query) || p.brand.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        // =========================================================
        // 6. RENDERIZADO DE INTERFAZ (DOM)
        // =========================================================
        function renderProducts(items) {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';

            if (items.length === 0) {
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');

            items.forEach(p => {
                const img = p.image_url || 'https://via.placeholder.com/400?text=Foto';
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all cursor-pointer overflow-hidden border border-gray-100 flex flex-col h-full";
                card.onclick = () => openProductModal(p);
                
                card.innerHTML = `
                    <div class="h-48 md:h-60 bg-gray-50 flex items-center justify-center p-2">
                        <img src="${img}" alt="${p.name}" class="w-full h-full object-contain hover:scale-105 transition-transform duration-300">
                    </div>
                    <div class="p-4 flex flex-col flex-1 justify-between">
                        <div>
                            <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">${p.brand}</p>
                            <h3 class="text-sm md:text-base font-bold text-gray-900 mt-1 leading-tight">${p.name}</h3>
                        </div>
                        <p class="text-lg font-black text-black mt-3">$${parseFloat(p.price).toFixed(2)}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderAdminProducts(items) {
            const tbody = document.getElementById('admin-products-list');
            tbody.innerHTML = '';
            
            items.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap">
                        <div class="flex items-center">
                            <img class="h-10 w-10 rounded object-contain bg-gray-50" src="${p.image_url}" alt="">
                            <div class="ml-3">
                                <div class="text-sm font-bold text-gray-900">${p.name}</div>
                                <div class="text-xs text-gray-500 uppercase">${p.brand}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-bold text-black">
                        $${parseFloat(p.price).toFixed(2)}
                    </td>
                    <td class="px-4 py-3 whitespace-nowrap text-right text-sm font-medium">
                        <button onclick="deleteProduct('${p.id}')" class="text-red-500 hover:text-red-700 bg-red-50 px-3 py-1 rounded-lg">
                            Eliminar
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // =========================================================
        // 7. FLUJO DE VENTAS / CHECKOUT WHATSAPP
        // =========================================================
        function openProductModal(product) {
            currentProduct = product;
            currentSelectedSize = null;
            
            document.getElementById('modal-img').src = product.image_url;
            document.getElementById('modal-brand').textContent = product.brand;
            document.getElementById('modal-name').textContent = product.name;
            document.getElementById('modal-price').textContent = `$${parseFloat(product.price).toFixed(2)}`;
            
            const sizesDiv = document.getElementById('modal-sizes');
            sizesDiv.innerHTML = '';
            
            // Renderizar tallas (separadas por coma)
            const sizes = product.sizes.split(',').map(s => s.trim()).filter(s => s);
            sizes.forEach(size => {
                const btn = document.createElement('button');
                btn.className = "size-btn px-4 py-2 border-2 border-gray-200 rounded-lg text-sm font-bold text-gray-700 hover:border-black transition-colors";
                btn.textContent = size;
                btn.onclick = () => selectSize(btn, size);
                sizesDiv.appendChild(btn);
            });

            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
            currentProduct = null;
        }

        function selectSize(btnEl, size) {
            currentSelectedSize = size;
            const buttons = document.querySelectorAll('.size-btn');
            buttons.forEach(b => { b.classList.remove('active'); b.style.borderColor = "#e5e7eb"; b.style.backgroundColor = "transparent"; b.style.color = "#374151"; });
            
            btnEl.classList.add('active');
            btnEl.style.borderColor = "#000";
            btnEl.style.backgroundColor = "#000";
            btnEl.style.color = "#fff";
        }

        function redirectToWhatsApp() {
            if (!currentProduct) return;
            if (!currentSelectedSize) return alert('Por favor, selecciona tu talla antes de continuar.');

            const msg = `Hola, me interesa este artículo de su catálogo:\n\n` +
                        `*Marca:* ${currentProduct.brand}\n` +
                        `*Modelo:* ${currentProduct.name}\n` +
                        `*Talla Elegida:* ${currentSelectedSize}\n` +
                        `*Precio:* $${currentProduct.price}\n\n` +
                        `*Foto:* ${currentProduct.image_url}`;

            const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
            window.open(url, '_blank');
        }

        // =========================================================
        // 8. CRUD ADMINISTRADOR (Guardar, Subir imagen al Bucket)
        // =========================================================
        async function handleProductSubmit(e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmitProduct');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Subiendo archivo y procesando...";

            const id = document.getElementById('editProductId').value;
            const brand = document.getElementById('p_brand').value;
            const name = document.getElementById('p_name').value;
            const price = parseFloat(document.getElementById('p_price').value);
            const sizes = document.getElementById('p_sizes').value;
            const imageFile = document.getElementById('p_image').files[0];

            let image_url = "";

            try {
                // Si el administrador tomó una foto o seleccionó de galería:
                if (imageFile) {
                    const ext = imageFile.name.split('.').pop();
                    const path = `uploads/${Date.now()}_${Math.random().toString(36).substring(7)}.${ext}`;

                    // Subir archivo al bucket 'productos'
                    const { error: uploadError } = await supabase.storage.from('productos').upload(path, imageFile);
                    if (uploadError) throw uploadError;

                    // Obtener URL de CDN
                    const { data: { publicUrl } } = supabase.storage.from('productos').getPublicUrl(path);
                    image_url = publicUrl;
                } else if (!id) {
                    throw new Error("Debes incluir una imagen para crear un nuevo producto.");
                }

                const productData = { brand, name, price, sizes };
                if (image_url) productData.image_url = image_url;

                if (id) {
                    const { error } = await supabase.from('products').update(productData).eq('id', id);
                    if (error) throw error;
                    alert('Actualizado con éxito');
                } else {
                    const { error } = await supabase.from('products').insert([productData]);
                    if (error) throw error;
                    alert('Publicado globalmente.');
                }

                document.getElementById('productForm').reset();
                document.getElementById('editProductId').value = '';
                
            } catch (error) {
                alert('Error en sistema: ' + error.message);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.textContent = "Guardar y Publicar";
                fetchProducts(); 
            }
        }

        async function deleteProduct(id) {
            if(!confirm("¿CONFIRMAS BORRAR ESTE PRODUCTO DE FORMA GLOBAL? No se puede deshacer.")) return;
            const { error } = await supabase.from('products').delete().eq('id', id);
            if (error) alert("Error al eliminar: " + error.message);
            else fetchProducts();
        }
    </script>
</body>
</html>
