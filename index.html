<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Yesica - Inventario y Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B;
      --secondary: #D9C3B0;
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --border: #E5E5E5;
      --text-dark: #2B2B2B;
      --text-muted: #737373;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; padding-bottom: 50px; }
    
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo-brand h1 { font-size: 20px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
    .logo-brand span { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
    
    .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    .hero-banner { background: var(--secondary); border-radius: var(--radius); padding: 30px; text-align: center; margin-bottom: 30px; }
    .hero-banner h2 { font-size: 26px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
    
    .filters-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 30px; }
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .tab-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-dark); padding: 10px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .search-box { position: relative; margin-top: 16px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 30px; border: 1px solid var(--border); font-size: 14px; outline: none; background: var(--bg-color); }
    .search-box input:focus { border-color: var(--primary); }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }
    
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    
    .card-img-wrapper { width: 100%; height: 220px; background: #F5F5F5; position: relative; cursor: pointer; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge-stock { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); color: var(--text-dark); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); z-index: 2; }
    
    .product-thumbnails { display: flex; gap: 6px; padding: 8px 12px 0 12px; overflow-x: auto; scrollbar-width: none; }
    .thumb-container { position: relative; flex-shrink: 0; }
    .thumb-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 2px solid var(--border); cursor: pointer; opacity: 0.7; display: block; }
    .thumb-img.active { border-color: var(--primary); opacity: 1; }
    .btn-delete-thumb { position: absolute; top: -4px; right: -4px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 16px; height: 16px; font-size: 9px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .category-tag { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .product-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
    
    /* Estilo de miniatura para inventario / salidas */
    .prod-info-cell { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .inventario-miniatura { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); margin-top: 4px; }

    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .price-tag { font-size: 18px; font-weight: 800; color: var(--text-dark); }
    .price-tag span { font-size: 13px; color: var(--text-muted); margin-right: 2px; }
    
    .btn-whatsapp { background: #25D366; color: white; padding: 8px 14px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo-brand">
        <h1>Boutique Yesica</h1>
        <span>Catálogo y Control</span>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="hero-banner">
      <h2>Gestión e Inventario</h2>
      <p>Sube múltiples fotos de la galería, actualiza sin perder las previas y gestiona salidas fácilmente.</p>
    </div>

    <!-- Ejemplo de cómo se vería la sección de inventario/salidas integrando la miniatura debajo de Prod -->
    <div class="filters-section" style="margin-bottom: 20px;">
      <h3 style="font-size: 16px; font-weight: 700; margin-bottom: 12px;"><i class="fa-solid fa-boxes-stacked"></i> Módulo de Salidas de Inventario (Vista Previa)</h3>
      <div id="inventarioSalidasList">
        <!-- Se llenará dinámicamente con la miniatura debajo del nombre del producto -->
      </div>
    </div>

    <div class="filters-section">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="todos" type="button">Todos</button>
        <button class="tab-btn" data-category="zapatos" type="button">👟 Zapatos</button>
        <button class="tab-btn" data-category="playeras" type="button">👕 Playeras</button>
        <button class="tab-btn" data-category="pantalones" type="button">👖 Pantalones</button>
        <button class="tab-btn" data-category="vestidos" type="button">👗 Vestidos</button>
        <button class="tab-btn" data-category="accesorios" type="button">👜 Accesorios</button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nombre...">
      </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <script>
    const WHATSAPP_NUMBER = '50233582829';
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error(e); }

    let productsList = [];
    let currentCategory = 'todos';
    const productSelectionState = {};

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          renderProducts();
        });
      });
      document.getElementById('searchInput').addEventListener('input', renderProducts);
      loadProducts();
    });

    async function loadProducts() {
      if (supabaseClient) {
        const { data } = await supabaseClient.from('productos').select('*');
        if (data) {
          productsList = data.map(item => {
            let imgs = [];
            if (item.imagen_url) {
              imgs = item.imagen_url.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
            }
            if (imgs.length === 0) imgs = ['https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80'];
            return { ...item, imagenes: imgs };
          });
        }
      }
      renderProducts();
      renderInventarioSalidas();
    }

    function formatNumber(num) {
      let val = Number(num);
      return (val % 1 === 0) ? val.toString() : val.toFixed(2);
    }

    function setProductImage(id, idx) {
      if (!productSelectionState[id]) productSelectionState[id] = { activeImgIdx: 0 };
      productSelectionState[id].activeImgIdx = idx;
      renderProducts();
    }

    // Función crucial: Sube múltiples fotos de la galería y las une sin borrar las previas
    async function agregarFotosDesdeGaleria(productId, archivosNuevos) {
      if (!supabaseClient || !archivosNuevos || archivosNuevos.length === 0) return;
      
      const producto = productsList.find(p => p.id == productId);
      if (!producto) return;

      let nuevasUrls = [];
      for (let archivo of archivosNuevos) {
        const fileName = `prod_${Date.now()}_${Math.random().toString(36).substring(2, 7)}`;
        const { error: uploadError } = await supabaseClient.storage
          .from('productos-bucket')
          .upload(fileName, archivo);

        if (!uploadError) {
          const { data: publicUrlData } = supabaseClient.storage
            .from('productos-bucket')
            .getPublicUrl(fileName);
          if (publicUrlData?.publicUrl) {
            nuevasUrls.push(publicUrlData.publicUrl);
          }
        }
      }

      // Combinar fotos existentes con las nuevas recién subidas
      let fotosFinales = [...producto.imagenes, ...nuevasUrls];
      let imagenUrlString = fotosFinales.join(',');

      // Actualizar en base de datos
      const { error } = await supabaseClient
        .from('productos')
        .update({ imagen_url: imagenUrlString })
        .eq('id', productId);

      if (!error) {
        await loadProducts(); // Recargar datos frescos
      } else {
        alert("Error al actualizar las imágenes en Supabase.");
      }
    }

    // Función para eliminar una foto específica de la lista del producto
    async function eliminarFotoIndividual(productId, indexParaBorrar) {
      const producto = productsList.find(p => p.id == productId);
      if (!producto) return;

      // Filtrar sacando el índice que se desea eliminar
      let fotosActualizadas = producto.imagenes.filter((_, idx) => idx !== indexParaBorrar);
      let imagenUrlString = fotosActualizadas.join(',');

      const { error } = await supabaseClient
        .from('productos')
        .update({ imagen_url: imagenUrlString })
        .eq('id', productId);

      if (!error) {
        await loadProducts();
      } else {
        alert("Error al eliminar la foto.");
      }
    }

    function renderInventarioSalidas() {
      const container = document.getElementById('inventarioSalidasList');
      if (!container) return;

      if (productsList.length === 0) {
        container.innerHTML = `<p style="font-size: 13px; color: var(--text-muted);">No hay productos registrados.</p>`;
        return;
      }

      // Muestra una lista simulada de salidas de inventario con la miniatura debajo del producto
      container.innerHTML = productsList.slice(0, 3).map(p => {
        const fotoPrincipal = p.imagenes[0] || '';
        return `
          <div style="display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;">
            <div>
              <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; font-weight: 700;">Prod</span>
              <div style="font-weight: 700; font-size: 14px; color: var(--text-dark);">${p.nombre}</div>
              ${fotoPrincipal ? `<img src="${fotoPrincipal}" class="inventario-miniatura" alt="Miniatura">` : ''}
            </div>
            <div style="text-align: right;">
              <span style="font-size: 12px; color: var(--text-muted); display: block;">Stock actual: <strong>${p.stock}</strong></span>
              <button type="button" style="background: var(--primary); color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; margin-top: 4px;" onclick="alert('Registrar salida para: ${p.nombre}')">Dar Salida</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = productsList.filter(p => {
        const matchesCategory = currentCategory === 'todos' || (p.categoria && p.categoria.toLowerCase() === currentCategory);
        const matchesSearch = p.nombre.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>No se encontraron productos</h3></div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        if (!productSelectionState[p.id]) productSelectionState[p.id] = { activeImgIdx: 0 };
        const state = productSelectionState[p.id];
        if (state.activeImgIdx >= p.imagenes.length) state.activeImgIdx = 0;
        const activeImg = p.imagenes[state.activeImgIdx];

        // Renderiza miniaturas con el botón 'X' para eliminar y un botón extra para subir más fotos de la galería
        let thumbsHtml = `
          <div class="product-thumbnails">
            ${p.imagenes.map((img, idx) => `
              <div class="thumb-container">
                <img src="${img}" class="thumb-img ${state.activeImgIdx === idx ? 'active' : ''}" onclick="setProductImage('${p.id}', ${idx})" alt="Thumb">
                <button type="button" class="btn-delete-thumb" onclick="eliminarFotoIndividual('${p.id}', ${idx})" title="Eliminar foto">×</button>
              </div>
            `).join('')}
            
            <label style="width: 40px; height: 40px; border-radius: 6px; border: 2px dashed var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--bg-color); flex-shrink: 0;" title="Agregar fotos de la galería">
              <i class="fa-solid fa-plus" style="font-size: 12px; color: var(--text-muted);"></i>
              <input type="file" accept="image/*" multiple style="display: none;" onchange="agregarFotosDesdeGaleria('${p.id}', this.files)">
            </label>
          </div>`;

        return `
          <div class="product-card">
            <div class="card-img-wrapper">
              <img src="${activeImg}" alt="${p.nombre}">
              <span class="badge-stock">Disp: ${p.stock}</span>
            </div>
            ${thumbsHtml}
            <div class="card-body">
              <span class="category-tag">${p.categoria}</span>
              <h3 class="product-title">${p.nombre}</h3>
              <div class="card-footer">
                <div class="price-tag"><span>Q</span>${formatNumber(p.precio)}</div>
                <a href="https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(activeImg+'\nHola, me interesa este producto: '+p.nombre)}" target="_blank" class="btn-whatsapp">
                  <i class="fa-brands fa-whatsapp"></i> Cotizar
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
