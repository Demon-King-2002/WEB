<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique Yesica - Catálogo</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #2B2B2B;
      --secondary: #D9C3B0;
      --bg-color: #FDFBF7;
      --card-bg: #FFFFFF;
      --border: #E5E5E5;
      --text-dark: #2B2B2B;
      --text-muted: #737373;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg-color); color: var(--text-dark); min-height: 100vh; padding-bottom: 50px; }
    
    header { background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
    .logo-brand h1 { font-size: 20px; font-weight: 800; color: var(--text-dark); letter-spacing: -0.5px; }
    .logo-brand span { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; }
    
    .main-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 16px; }
    .hero-banner { background: var(--secondary); border-radius: var(--radius); padding: 30px; text-align: center; margin-bottom: 30px; }
    .hero-banner h2 { font-size: 26px; font-weight: 800; color: var(--text-dark); margin-bottom: 8px; }
    
    .filters-section { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 30px; }
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 12px; scrollbar-width: none; }
    .tab-btn { background: var(--bg-color); border: 1px solid var(--border); color: var(--text-dark); padding: 10px 18px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    
    .search-box { position: relative; margin-top: 16px; }
    .search-box input { width: 100%; padding: 12px 16px 12px 42px; border-radius: 30px; border: 1px solid var(--border); font-size: 14px; outline: none; background: var(--bg-color); }
    .search-box input:focus { border-color: var(--primary); }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
    
    .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    @media (min-width: 768px) { .products-grid { grid-template-columns: repeat(4, 1fr); gap: 24px; } }
    
    .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    
    .card-img-wrapper { width: 100%; height: 220px; background: #F5F5F5; position: relative; cursor: pointer; }
    .card-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    .badge-stock { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,0.9); color: var(--text-dark); padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; border: 1px solid var(--border); z-index: 2; }
    
    .product-thumbnails { display: flex; gap: 6px; padding: 8px 12px 0 12px; overflow-x: auto; scrollbar-width: none; }
    .thumb-img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 2px solid var(--border); cursor: pointer; opacity: 0.7; flex-shrink: 0; }
    .thumb-img.active { border-color: var(--primary); opacity: 1; }

    .card-body { padding: 16px; display: flex; flex-direction: column; flex-grow: 1; }
    .category-tag { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .product-title { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
    
    .card-footer { margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; }
    .price-tag { font-size: 18px; font-weight: 800; color: var(--text-dark); }
    .price-tag span { font-size: 13px; color: var(--text-muted); margin-right: 2px; }
    
    .btn-whatsapp { background: #25D366; color: white; padding: 8px 14px; border-radius: 20px; text-decoration: none; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
  </style>
</head>
<body>
  <header>
    <div class="nav-container">
      <div class="logo-brand">
        <h1>Boutique Yesica</h1>
        <span>Catálogo Exclusivo</span>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="hero-banner">
      <h2>Nueva Colección</h2>
      <p>Estilo y elegancia a tu alcance.</p>
    </div>

    <div class="filters-section">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="todos" type="button">Todos</button>
        <button class="tab-btn" data-category="zapatos" type="button">👟 Zapatos</button>
        <button class="tab-btn" data-category="playeras" type="button">👕 Playeras</button>
        <button class="tab-btn" data-category="pantalones" type="button">👖 Pantalones</button>
        <button class="tab-btn" data-category="vestidos" type="button">👗 Vestidos</button>
        <button class="tab-btn" data-category="accesorios" type="button">👜 Accesorios</button>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar por nombre...">
      </div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <script>
    const WHATSAPP_NUMBER = '50233582829';
    const SUPABASE_URL = 'https://zfbvhdkoknzrwqfjthsb.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ZS0wdekGGQ0FI77CPFmsbw_rsS1FkEI';
    let supabaseClient = null;

    try {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.error(e); }

    let productsList = [];
    let currentCategory = 'todos';
    const productSelectionState = {};

    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.getAttribute('data-category');
          renderProducts();
        });
      });
      document.getElementById('searchInput').addEventListener('input', renderProducts);
      loadProducts();
    });

    async function loadProducts() {
      if (supabaseClient) {
        const { data } = await supabaseClient.from('productos').select('*');
        if (data) {
          productsList = data.map(item => {
            let imgs = [];
            if (item.imagen_url) {
              imgs = item.imagen_url.split(/[\n,]+/).map(s => s.trim()).filter(s => s.length > 0);
            }
            if (imgs.length === 0) imgs = ['https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=600&q=80'];
            return { ...item, imagenes: imgs };
          });
        }
      }
      renderProducts();
    }

    function formatNumber(num) {
      let val = Number(num);
      return (val % 1 === 0) ? val.toString() : val.toFixed(2);
    }

    function setProductImage(id, idx) {
      if (!productSelectionState[id]) productSelectionState[id] = { activeImgIdx: 0 };
      productSelectionState[id].activeImgIdx = idx;
      renderProducts();
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase();

      const filtered = productsList.filter(p => {
        const matchesCategory = currentCategory === 'todos' || (p.categoria && p.categoria.toLowerCase() === currentCategory);
        const matchesSearch = p.nombre.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state"><h3>No se encontraron productos</h3></div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        if (!productSelectionState[p.id]) productSelectionState[p.id] = { activeImgIdx: 0 };
        const state = productSelectionState[p.id];
        if (state.activeImgIdx >= p.imagenes.length) state.activeImgIdx = 0;
        const activeImg = p.imagenes[state.activeImgIdx];

        let thumbsHtml = p.imagenes.length > 1 ? `
          <div class="product-thumbnails">
            ${p.imagenes.map((img, idx) => `
              <img src="${img}" class="thumb-img ${state.activeImgIdx === idx ? 'active' : ''}" onclick="setProductImage('${p.id}', ${idx})" alt="Thumb">
            `).join('')}
          </div>` : '';

        return `
          <div class="product-card">
            <div class="card-img-wrapper">
              <img src="${activeImg}" alt="${p.nombre}">
              <span class="badge-stock">Disp: ${p.stock}</span>
            </div>
            ${thumbsHtml}
            <div class="card-body">
              <span class="category-tag">${p.categoria}</span>
              <h3 class="product-title">${p.nombre}</h3>
              <div class="card-footer">
                <div class="price-tag"><span>Q</span>${formatNumber(p.precio)}</div>
                <a href="https://api.whatsapp.com/send?phone=${WHATSAPP_NUMBER}&text=${encodeURIComponent(activeImg+'\nHola, me interesa este producto: '+p.nombre)}" target="_blank" class="btn-whatsapp">
                  <i class="fa-brands fa-whatsapp"></i> Cotizar
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
